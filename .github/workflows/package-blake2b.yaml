name: Package BLAKE2b

# jpackage builds only for the host OS and architecture, so the five release artifacts need five
# runners. This matrix is upstream's. The Linux runners also build the headless Sparrow Server packages.
#
# The macOS jobs produce an UNSIGNED .dmg. Upstream signs and notarizes with its own Apple Developer
# ID, which is not ours to use, so that step is gone and Gatekeeper will refuse the app on first
# launch until the user right-clicks Open or clears the quarantine attribute. That is documented in
# the release notes rather than worked around.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JDK_JAVAC_OPTIONS: '-Xlint:-module'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      # Upstream does this for reproducibility: a pre-seeded tool cache can hold a different JDK
      # build than the one requested below, and jlink bakes the JDK into the image.
      - name: Clear Java tool-cache for reproducibility
        shell: bash
        run: rm -rf "$RUNNER_TOOL_CACHE"/Java_*

      - name: Set up JDK 25.0.5
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25.0.5'

      - name: Show build versions
        run: ./gradlew -v

      # Run the suite before packaging. The header and difficulty rules this fork adds are consensus
      # code in a wallet, so a red test must stop a release artifact from being produced at all.
      - name: Test
        # lark's tests are left to the test workflow: one enumerates real HID, serial and WebUSB devices, which has
        # never run on these five runners, and a native library failing to load on one would stop a release over CI
        # hardware rather than code
        run: ./gradlew :drongo:test test

      - name: Build with Gradle
        run: ./gradlew jpackage

      - name: Package Windows zip distribution
        if: ${{ runner.os == 'Windows' }}
        run: ./gradlew packageZipDistribution

      - name: Package Linux tar distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageTarDistribution

      # jpackage writes the .deb with zstd, which dpkg before Debian 12 and Ubuntu 21.10 cannot read. Upstream's
      # script recompresses it with xz.
      - name: Repackage Linux deb distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./repackage.sh

      # The packages must declare this fork's name and the release as their revision, or they would replace upstream's
      # package, or fail to upgrade an earlier release of this one. Checked here rather than trusted, before upload.
      - name: Check the Linux package names and versions
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: .github/scripts/check-linux-packages.sh sparrowwallet-blake2b

      # jpackage names the .msi from the app name and its version, which on Windows is the ProductVersion the release is
      # folded into (2.5.6-blake2b.8 is 2.5.6008). It takes the release the app reports, as the other artifacts do.
      - name: Name the Windows installer for its release
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          msi=$(find build/jpackage -maxdepth 1 -name '*.msi' | head -1)
          [ -n "$msi" ] || { echo "no .msi produced"; ls -la build/jpackage; exit 1; }
          suffix=$(sed -n 's/.*APP_VERSION_SUFFIX = "\([^"]*\)";.*/\1/p' src/main/java/com/sparrowwallet/sparrow/SparrowWallet.java)
          version=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)
          [ -n "$suffix" ] && [ -n "$version" ] || { echo "no version or APP_VERSION_SUFFIX found"; exit 1; }
          mv "$msi" "build/jpackage/Sparrow-BLAKE2b-${version}${suffix}.msi"
          ls -la build/jpackage/*.msi

      # jpackage names the .dmg from installerName and version alone, so both macOS jobs would
      # otherwise emit the same filename and the second would overwrite the first on the release.
      # jpackage's version is the upstream base, which cannot carry the release suffix, so the name
      # takes the release the app reports, from the same constant the zip and tar names read.
      - name: Name the macOS disk image for its architecture
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          arch=$([ "$(uname -m)" = "arm64" ] && echo aarch64 || echo x86_64)
          dmg=$(find build/jpackage -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "no .dmg produced"; ls -la build/jpackage; exit 1; }
          version=$(basename "$dmg" .dmg | sed 's/^.*-//')
          suffix=$(sed -n 's/.*APP_VERSION_SUFFIX = "\([^"]*\)";.*/\1/p' src/main/java/com/sparrowwallet/sparrow/SparrowWallet.java)
          [ -n "$suffix" ] || { echo "no APP_VERSION_SUFFIX found"; exit 1; }
          mv "$dmg" "build/jpackage/Sparrow-BLAKE2b-${version}${suffix}-${arch}.dmg"
          ls -la build/jpackage/*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparrow-blake2b-${{ runner.os }}-${{ runner.arch }}
          # Only the distributable files. The unpacked app image and .app bundle are inputs to those
          # archives, not things to publish, and together they are far larger than what they produce.
          path: |
            build/jpackage/*.dmg
            build/jpackage/*.msi
            build/jpackage/*.zip
            build/jpackage/*.tar.gz
            build/jpackage/*.deb
            build/jpackage/*.rpm
          if-no-files-found: error

      # Sparrow Server, the terminal build. A clean build, since the headless image differs from the desktop one; the
      # desktop artifacts are uploaded above first.
      - name: Headless build with Gradle
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew -Djava.awt.headless=true clean jpackage

      - name: Package Linux headless tar distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew -Djava.awt.headless=true packageTarDistribution

      - name: Repackage Linux headless deb distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./repackage.sh

      - name: Check the Linux headless package names and versions
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: .github/scripts/check-linux-packages.sh sparrowserver-blake2b

      - name: Upload headless artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparrow-blake2b-server-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/jpackage/*.tar.gz
            build/jpackage/*.deb
            build/jpackage/*.rpm
          if-no-files-found: error
