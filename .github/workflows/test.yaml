name: Test

# The suite only ran inside the release workflow, which is dispatched by hand on a tag. That stops a red build from
# becoming a release, but nothing said a branch was red until release day. The header, difficulty, unified sighash and
# maturity rules this fork adds are consensus code in a wallet, so they run on every push and pull request. After
# Shrike's test workflow (10eea0c4), without its manifest scripts, which this fork does not have.
on:
  push:
    branches: [blake2b]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      # The same JDK the release workflow builds with
      - name: Set up JDK 25.0.5
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25.0.5'

      # No display is set up on purpose: the tests run without a JavaFX toolkit, and anything needing one or a live
      # server is a harness with a main method rather than a test
      - name: Run the test suite
        run: ./gradlew :drongo:test :lark:test test

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
            drongo/build/test-results/
            lark/build/test-results/
          retention-days: 7
